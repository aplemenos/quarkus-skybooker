# Full stack: a PostgreSQL per service (database-per-service) + both services.
# Services run the PROD profile (the default for a packaged app) and read their
# config from the environment below.
#
# Build the app jars first, then start:
#   (cd flight-service && ./mvnw package -DskipTests)
#   (cd booking-service && ./mvnw package -DskipTests)
#   docker compose up --build
#
# flight-service  -> http://localhost:8701   (health/metrics: http://localhost:9001/q)
# booking-service -> http://localhost:8702   (health/metrics: http://localhost:9002/q)
#
# Health and metrics live on a separate MANAGEMENT port (9001/9002), off the
# public app port. Only the app port need be public in production; the
# management port is mapped here for local convenience.

services:
  flights-db:
    image: postgres:18
    environment:
      POSTGRES_DB: flights_db
      POSTGRES_USER: flights
      POSTGRES_PASSWORD: flights
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flights -d flights_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bookings-db:
    image: postgres:18
    environment:
      POSTGRES_DB: bookings_db
      POSTGRES_USER: bookings
      POSTGRES_PASSWORD: bookings
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookings -d bookings_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  flight-service:
    build:
      context: ./flight-service
      dockerfile: src/main/docker/Dockerfile.jvm
    depends_on:
      flights-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://flights-db:5432/flights_db
      DB_USERNAME: flights
      DB_PASSWORD: flights
    ports:
      - "8701:8801"   # app
      - "9001:9001"   # management (health + metrics)

  booking-service:
    build:
      context: ./booking-service
      dockerfile: src/main/docker/Dockerfile.jvm
    depends_on:
      bookings-db:
        condition: service_healthy
      flight-service:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://bookings-db:5432/bookings_db
      DB_USERNAME: bookings
      DB_PASSWORD: bookings
      FLIGHT_SERVICE_URL: http://flight-service:8801
      # Readiness probes flight-service's health on its management port.
      FLIGHT_MANAGEMENT_URL: http://flight-service:9001
    ports:
      - "8702:8802"   # app
      - "9002:9002"   # management (health + metrics)
