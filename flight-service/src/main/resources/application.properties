# ---- flight-service ----
quarkus.application.name=flight-service
quarkus.http.port=8701
# In containers (prod) listen on 8801 (booking-service uses 8802).
%prod.quarkus.http.port=8801

# ---- Application config (MicroProfile Config) ----
flight.max-seats-per-reservation=10

# ---- JWT authentication (verify only) ----
# Verifies the token issued by booking-service and propagated on the internal
# call, using the shared public key. Every hop is authenticated (zero trust).
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://skybooker/issuer

# ---- Management interface ----
# Health and metrics move to a separate port so they are NOT served on the public
# app port. In production, you expose only the app port and keep 9001 internal
# (reached by the orchestrator's probes and Prometheus).
quarkus.management.enabled=true
quarkus.management.port=9001

# ---- Schema management: Flyway owns it, Hibernate validates (dev/prod parity) ----
# Flyway runs the migrations at startup in EVERY environment; Hibernate only
# checks that the entities match the Flyway-created schema.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true

# ---- Datasource per profile ----
# DEV/TEST: Quarkus Dev Services auto-starts PostgreSQL (dev pins a fixed port
# for DB inspection; test uses a random port so it can run alongside dev).
%dev.quarkus.datasource.devservices.port=5544
# Pin the Dev Services image so dev matches the docker-compose stack.
%dev.quarkus.datasource.devservices.image-name=postgres:18
%test.quarkus.datasource.devservices.image-name=postgres:18
# PROD: a real PostgreSQL, configured entirely from environment variables.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME:flights}
%prod.quarkus.datasource.password=${DB_PASSWORD:flights}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/flights_db}

# Flights ASCII-art startup banners for Quarkus
quarkus.banner-generator.text=FLIGHTS
quarkus.banner-generator.font=doom

# ---- Logging ----
%dev.quarkus.log.category."com.aplemenos".level=DEBUG
