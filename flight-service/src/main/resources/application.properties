# ---- flight-service ----
quarkus.application.name=flight-service
quarkus.http.port=8701

# ---- Application config (MicroProfile Config) ----
flight.max-seats-per-reservation=10

# ---- Schema management per profile ----
# DEV/TEST recreate the schema and load seed data; PROD only validates it
# (in a real system the prod schema would be owned by Flyway migrations).
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%test.quarkus.hibernate-orm.sql-load-script=import.sql
%prod.quarkus.hibernate-orm.sql-load-script=no-file

# ---- Datasource per profile ----
# DEV/TEST: Quarkus Dev Services auto-starts PostgreSQL (dev pins a fixed port
# for DB inspection; test uses a random port so it can run alongside dev).
%dev.quarkus.datasource.devservices.port=5544
# PROD: a real PostgreSQL, configured entirely from environment variables.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME:flights}
%prod.quarkus.datasource.password=${DB_PASSWORD:flights}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/flights_db}

# ---- Logging ----
%dev.quarkus.log.category."com.aplemenos".level=DEBUG
