# ---- flight-service ----
quarkus.application.name=flight-service
quarkus.http.port=8701

# Persistence. In dev/test the schema is (re)created and import.sql is loaded.
# Profiles (DEV/TEST/PROD) are refined in a later milestone.
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Pin the Dev Services PostgreSQL to a fixed host port ONLY in dev, so it can be
# inspected with a DB client. Tests keep the default random port, so `mvn test`
# can run even while `quarkus:dev` is up (otherwise both fight over 5544).
%dev.quarkus.datasource.devservices.port=5544
