# ---- booking-service ----
quarkus.application.name=booking-service
quarkus.http.port=8702
# In containers (prod) listen on 8802 (flight-service uses 8801).
%prod.quarkus.http.port=8802

# ---- Application config (MicroProfile Config) ----
booking.max-seats=9

# ---- Schema management (build-time in Quarkus) ----
# Recreate the schema in all profiles so the containerized demo self-initializes.
# A genuine production deployment would own the schema with Flyway (strategy=validate).
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# ---- Datasource per profile ----
# DEV/TEST: Dev Services auto Postgres (dev pins a port; test uses random).
%dev.quarkus.datasource.devservices.port=5545
# Pin the Dev Services image so dev matches the docker-compose stack.
%dev.quarkus.datasource.devservices.image-name=postgres:18
%test.quarkus.datasource.devservices.image-name=postgres:18
# PROD: real PostgreSQL from environment variables.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME:bookings}
%prod.quarkus.datasource.password=${DB_PASSWORD:bookings}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/bookings_db}

# ---- REST client → flight-service, per profile ----
%dev.quarkus.rest-client.flight-api.url=http://localhost:8701
%test.quarkus.rest-client.flight-api.url=http://localhost:8701
%prod.quarkus.rest-client.flight-api.url=${FLIGHT_SERVICE_URL:http://flight-service:8080}

# ---- Logging ----
%dev.quarkus.log.category."com.aplemenos".level=DEBUG
