# ---- booking-service ----
quarkus.application.name=booking-service
quarkus.http.port=8702
# In containers (prod) listen on 8802 (flight-service uses 8801).
%prod.quarkus.http.port=8802

# ---- Application config (MicroProfile Config) ----
booking.max-seats=9

# ---- JWT authentication (issue + verify) ----
# Signs tokens with the private key; verifies incoming tokens with the public key.
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://skybooker/issuer
smallrye.jwt.sign.key.location=privateKey.pem
# Demo login credentials (DEV/DEMO ONLY — do not use real ones here).
app.auth.username=demo
app.auth.password=demo123

# ---- Schema management: Flyway owns it, Hibernate validates (dev/prod parity) ----
# Flyway runs the migrations at startup in EVERY environment; Hibernate only
# validates that the entities match the Flyway-created schema. (No seed data —
# bookings are created at runtime.)
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true

# ---- Datasource per profile ----
# DEV/TEST: Dev Services auto Postgres (dev pins a port; test uses random).
%dev.quarkus.datasource.devservices.port=5545
# Pin the Dev Services image so dev matches the docker-compose stack.
%dev.quarkus.datasource.devservices.image-name=postgres:18
%test.quarkus.datasource.devservices.image-name=postgres:18
# PROD: real PostgreSQL from environment variables.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME:bookings}
%prod.quarkus.datasource.password=${DB_PASSWORD:bookings}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/bookings_db}

# ---- Management interface ----
# Health and metrics move to a separate port, off the public app port.
quarkus.management.enabled=true
quarkus.management.port=9002

# ---- REST client → flight-service, per profile ----
%dev.quarkus.rest-client.flight-api.url=http://localhost:8701
%test.quarkus.rest-client.flight-api.url=http://localhost:8701
%prod.quarkus.rest-client.flight-api.url=${FLIGHT_SERVICE_URL:http://flight-service:8801}

# The readiness check pings flight-service's health, which now lives on its
# MANAGEMENT port (9001), not the app port.
%dev.quarkus.rest-client.flight-health-api.url=http://localhost:9001
%test.quarkus.rest-client.flight-health-api.url=http://localhost:9001
%prod.quarkus.rest-client.flight-health-api.url=${FLIGHT_MANAGEMENT_URL:http://flight-service:9001}

# Bookers ASCII-art startup banners for Quarkus
quarkus.banner-generator.text=BOOKERS
quarkus.banner-generator.font=doom

# ---- Logging ----
%dev.quarkus.log.category."com.aplemenos".level=DEBUG
