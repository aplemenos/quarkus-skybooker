# ---- booking-service ----
quarkus.application.name=booking-service
quarkus.http.port=8702

# Persistence. In dev/test the schema is (re)created.
# Profiles (DEV/TEST/PROD) are refined in a later milestone.
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Pin the Dev Services PostgreSQL to a fixed host port ONLY in dev (5545, distinct
# from flight-service's 5544) so both services can run in dev simultaneously.
# Tests keep the default random port.
%dev.quarkus.datasource.devservices.port=5545
